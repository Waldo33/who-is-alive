# Домен игры: делегирование (NS) снаружи и записи A,
# добавляем домен в аккаунт Cloud, если его там нет, и показываем записи.
# Логи публичные: печатаем только имена серверов, статусы и DNS-записи (они и так публичны).
name: infra-domain

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/infra-domain.yml']

permissions:
  contents: read

jobs:
  domain:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TWC_TOKEN: ${{ secrets.TWC_TOKEN }}
      API: https://api.timeweb.cloud/api/v1
      DOMAIN: benobody.app
    steps:
      - name: Делегирование снаружи
        run: |
          echo "NS у реестра (.app):"; dig +short NS "$DOMAIN" @8.8.8.8 || true
          echo "SOA:"; dig +short SOA "$DOMAIN" @1.1.1.1 || true
          echo "A:"; dig +short A "$DOMAIN" @8.8.8.8 || true
          echo "A api.:"; dig +short A "api.$DOMAIN" @8.8.8.8 || true
          # IPv6: у наших серверов его нет — любая запись AAAA уводит телефоны с IPv6 мимо игры (на заглушку)
          # после правки в панели NS Timeweb применяют зону не сразу — ждём до 10 минут, пока лишние AAAA уйдут
          for _ in $(seq 1 20); do
            left=$(for h in "$DOMAIN" "www.$DOMAIN"; do for ns in ns1.timeweb.ru ns2.timeweb.ru; do dig +short +time=3 +tries=2 AAAA "$h" @$ns | grep ':' ; done; done | sort -u)
            [ -z "$left" ] && break
            echo "$(date +%T) у NS Timeweb ещё есть AAAA: $(echo $left) — жду"
            sleep 30
          done
          bad=""
          for h in "$DOMAIN" "www.$DOMAIN" "api.$DOMAIN"; do
            # у самих NS Timeweb (свежо, без кэша) и у 8.8.8.8 (что видят люди; кэш до TTL)
            # ns1 и ns2 Timeweb синхронизируются не мгновенно — спрашиваем оба
            v6=$( (dig +short +time=3 +tries=2 AAAA "$h" @ns1.timeweb.ru; dig +short +time=3 +tries=2 AAAA "$h" @ns2.timeweb.ru) | grep ':' | sort -u | tr "\n" " ")
            v6g=$(dig +short AAAA "$h" @8.8.8.8 | tr "\n" " ")
            echo "AAAA $h: у ns1/ns2.timeweb.ru ${v6:-нет} · у 8.8.8.8 ${v6g:-нет}"
            [ -n "$v6" ] && bad="$bad $h"
          done
          if [ -n "$bad" ]; then echo "::warning::лишние записи AAAA:$bad — удалить в панели DNS (у серверов нет IPv6)"; else echo "AAAA: лишних нет"; fi
          echo "RDAP реестра .app (статус, NS, регистратор, даты):"
          curl -sS "https://pubapi.registry.google/rdap/domain/$DOMAIN" -o /tmp/rdap.json -w 'HTTP %{http_code}\n' || true
          jq -r '"статус: \(.status // [] | join(", "))", "NS: \([.nameservers[]?.ldhName] | join(", "))", (.events[]? | "\(.eventAction): \(.eventDate)"), ([.entities[]? | select(.roles | index("registrar")) | .vcardArray[1][]? | select(.[0] == "fn") | .[3]] | "регистратор: \(join(", "))")' /tmp/rdap.json 2>/dev/null || head -c 300 /tmp/rdap.json

      - name: Домен в Timeweb Cloud
        run: |
          code=$(curl -sS -o /tmp/d.json -w '%{http_code}' -H "Authorization: Bearer $TWC_TOKEN" "$API/domains/$DOMAIN")
          echo "domains/$DOMAIN: HTTP $code"
          if [ "$code" = 404 ]; then
            code=$(curl -sS -o /tmp/add.json -w '%{http_code}' -X POST -H "Authorization: Bearer $TWC_TOKEN" -H 'Content-Type: application/json' -d '{}' "$API/add-domain/$DOMAIN")
            echo "add-domain: HTTP $code"; jq -r '.message // .error_code // "ok"' /tmp/add.json 2>/dev/null || true
            sleep 3
            curl -sS -o /tmp/d.json -H "Authorization: Bearer $TWC_TOKEN" "$API/domains/$DOMAIN"
          fi
          jq -r '.domain? // . | "fqdn: \(.fqdn // "?")\nстатус: \(.domain_status // "?")\nтехнический: \(.is_technical // "?")\nпровайдер: \(.provider // "?")\nNS: \(.nameservers? // [] | tostring)"' /tmp/d.json 2>/dev/null || true
          echo "поля:"; jq -c '.domain? // . | keys' /tmp/d.json 2>/dev/null || true

      - name: DNS-записи в Cloud
        run: |
          curl -sS -H "Authorization: Bearer $TWC_TOKEN" "$API/domains/$DOMAIN/dns-records" | jq -r '.dns_records[]? | "\(.type)\t\(.data.subdomain // "@")\t\(.data.value // "")"' || true
