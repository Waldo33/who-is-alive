# Бот тревог: проверить чат тревог (тип, переезд в супергруппу, права бота, события). Ничего не отправляет.
# Ключ — GitHub Secret ALERTS_BOT_TOKEN. Печатаем только id и название чатов (не секрет без ключа).
name: infra-alerts-chat

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/infra-alerts-chat.yml']

permissions:
  contents: read

jobs:
  chat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TOKEN: ${{ secrets.ALERTS_BOT_TOKEN }}
    steps:
      - name: Чат тревог — что с ним сейчас
        env:
          CHAT: '-5387784292'
        run: |
          [ -n "$TOKEN" ] || { echo "::error::нет ALERTS_BOT_TOKEN"; exit 1; }
          api() { curl -sS -m 20 "https://api.telegram.org/bot$TOKEN/$1" -H 'Content-Type: application/json' ${2:+-d "$2"}; }
          echo "── бот"; api getMe | jq -c '.result | {username, first_name}'
          echo "── вебхук бота тревог (если есть — getUpdates не работает)"; api getWebhookInfo | jq -c '.result | {url, pending_update_count, last_error_message}'
          echo "── getChat $CHAT"; api getChat "$(jq -nc --arg c "$CHAT" '{chat_id: $c}')" | jq -c '{ok, description, parameters, chat: (.result | {id, type, title, migrate_to_chat_id: .migrate_to_chat_id, message_auto_delete_time, has_hidden_members})}'
          echo "── права бота в чате"; me=$(api getMe | jq -r .result.id); api getChatMember "$(jq -nc --arg c "$CHAT" --arg u "$me" '{chat_id: $c, user_id: ($u|tonumber)}')" | jq -c '{ok, description, status: .result.status}'
          echo "── события бота (getUpdates)"
          api getUpdates > /tmp/u.json
          jq -c '{ok, description, n: (.result | length)}' /tmp/u.json
          jq -c '.result[]? | {date: ((.message.date // .my_chat_member.date // 0) | todate), chat: ((.message.chat // .my_chat_member.chat) | {id, type, title}), migrate_to: .message.migrate_to_chat_id, migrate_from: .message.migrate_from_chat_id, member: .my_chat_member.new_chat_member.status, text: (.message.text // null | if . then .[0:40] else . end), deleted: .message.delete_chat_photo}' /tmp/u.json | tail -30
