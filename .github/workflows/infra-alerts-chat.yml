# Бот тревог: найти группу, куда его добавили, и прислать проверочное сообщение.
# Ключ — GitHub Secret ALERTS_BOT_TOKEN. Печатаем только id и название чатов (не секрет без ключа).
name: infra-alerts-chat

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/infra-alerts-chat.yml']

permissions:
  contents: read

jobs:
  chat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TOKEN: ${{ secrets.ALERTS_BOT_TOKEN }}
    steps:
      - name: Бот и его чаты
        run: |
          [ -n "$TOKEN" ] || { echo "::error::нет ALERTS_BOT_TOKEN"; exit 1; }
          curl -fsS "https://api.telegram.org/bot$TOKEN/getMe" | jq -c '.result | {username, first_name}'
          curl -fsS "https://api.telegram.org/bot$TOKEN/getUpdates" > /tmp/u.json
          echo "обновлений: $(jq '.result | length' /tmp/u.json), виды: $(jq -c '[.result[] | keys - ["update_id"] | .[0]] | unique' /tmp/u.json)"
          jq -c '[.result[] | (.my_chat_member.chat // .message.chat // .channel_post.chat // .my_chat_member // empty) | {id, type, title}]' /tmp/u.json
          jq -r '[.result[] | (.my_chat_member.chat // .message.chat // .channel_post.chat // empty) | select(.type != "private") | "\(.id)\t\(.type)\t\(.title)"] | unique | .[]' /tmp/u.json | tee /tmp/chats.tsv
          [ -s /tmp/chats.tsv ] || { echo "::warning::групп не найдено — напиши что-нибудь в группе с ботом и перезапусти"; exit 0; }
          chat=$(tail -1 /tmp/chats.tsv | cut -f1)
          echo "CHAT=$chat"
          curl -fsS -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" -H 'Content-Type: application/json' \
            -d "$(jq -nc --arg c "$chat" '{chat_id: $c, text: "🎬 Массовка: тревоги подключены. Сюда будут приходить сообщения, если игра, сайт или бот перестанут отвечать, и итоги выкладок."}')" | jq -c '.ok'
