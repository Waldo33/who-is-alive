# Диагностика серверов (Европа и Нидерланды): службы, наблюдение, сторож и журналы (без секретов). Запуск — правкой этого файла (25.11 22:30).
name: infra-diag

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/infra-diag.yml']

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    # секреты прода — только в окружении production, а оно пускает только ветку main (docs/security.md)
    environment: production
    timeout-minutes: 10
    env:
      TWC_TOKEN: ${{ secrets.TWC_TOKEN }}
      SSH_OPTS: -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20 -o LogLevel=ERROR
      FIND_ONLY: '1'
      TG_REACH: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: python3 -m venv /tmp/py && /tmp/py/bin/pip install -q cryptography
      - id: game
        env: { SERVER_NAME: massovka-eu }
        run: /tmp/py/bin/python infra/game/provision.py
      - id: infra
        env: { SERVER_NAME: massovka-infra }
        run: /tmp/py/bin/python infra/game/provision.py
      - name: Нидерланды
        env:
          IP: ${{ steps.infra.outputs.ip }}
          MSK: ${{ steps.game.outputs.ip }}  # игровой сервер (Европа); имя переменной — с прежних времён
        run: |
          ssh $SSH_OPTS root@$IP "MSK=$MSK bash -s" <<'SH'
          systemctl is-active massovka-tunnel-eu 'massovka-game@*' caddy postgresql || true; cat /etc/massovka/active-color 2>/dev/null || true
          journalctl -u massovka-tunnel-eu -n 15 --no-pager -o cat | tail -6
          echo "перезапусков туннеля за час: $(journalctl -u massovka-tunnel-eu --since "1 hour ago" --no-pager -o cat | grep -c "Started")"
          timeout 8 bash -c "</dev/tcp/$MSK/22" && echo "порт 22 Европы: открыт" || echo "порт 22 Европы: нет"
          timeout 8 bash -c "</dev/tcp/$MSK/443" && echo "порт 443 Европы: открыт" || echo "порт 443 Европы: нет"
          free -m | head -2
          echo "── наблюдение"
          systemctl is-active node_exporter victoria-metrics victoria-logs grafana systemd-journal-upload 2>&1 | paste -sd' ' || true
          systemctl list-units --no-pager --no-legend 'massovka-*' 'victoria*' 'grafana*' 'node*' '*journal-upload*' | cut -c1-90
          curl -fsS -m5 'http://127.0.0.1:8428/api/v1/query?query=up' | python3 -c 'import json,sys;[print("up", r["metric"].get("job"), r["metric"].get("server"), r["value"][1]) for r in json.load(sys.stdin)["data"]["result"]]'
          curl -fsS -m5 'http://127.0.0.1:8428/api/v1/query?query=count(%7B__name__!=%22%22%7D)' | head -c 200; echo
          curl -fsS -m5 'http://127.0.0.1:9428/select/logsql/query' --data-urlencode 'query=_time:10m | stats by (_stream) count() n' | cut -c1-200 | head -8
          curl -fsS -m5 http://127.0.0.1:3001/api/health | tr -d '\n '; echo
          for ds in vm vl pg; do printf "источник $ds: "; curl -sS -m15 -u "admin:$(cat /etc/massovka-grafana/admin.pw)" http://127.0.0.1:3001/api/datasources/uid/$ds/health | head -c 200; echo; done
          curl -sS -m15 -u "admin:$(cat /etc/massovka-grafana/admin.pw)" 'http://127.0.0.1:3001/api/search?type=dash-db' | python3 -c 'import json,sys;[print("панель:", d["title"]) for d in json.load(sys.stdin)]'
          printf "событий в базе игры (Европа) за сутки: "; PGPASSWORD=$(. /etc/massovka-grafana/pgro.env; echo $PGRO_PASSWORD) psql -h 127.0.0.1 -p 25432 -U grafana_ro -d massovka -Atc "select count(*)||' ('||count(distinct device_id)||' устройств)' from analytics_events where created_at > now()-interval '1 day'"
          curl -sS -m10 -o /dev/null -w "grafana снаружи: %{http_code}\n" https://72-56-73-184.sslip.io/grafana/login
          curl -sS -m10 -o /dev/null -w "grafana /grafana/: %{http_code} → %{redirect_url}\n" https://72-56-73-184.sslip.io/grafana/
          systemctl is-active caddy grafana; systemctl show grafana -p NRestarts -p ActiveEnterTimestamp -p MemoryCurrent
          echo "── журнал Grafana"; journalctl -u grafana -n 40 --no-pager -o cat | grep -viE 'level=info' | cut -c1-300 | tail -25
          ss -ltnp | grep -E ':3001|:8080|:443' || true
          grep -n "grafana\|^[a-z0-9:/.-]* {" /etc/caddy/Caddyfile | head -20
          systemctl list-timers --no-pager | grep -E "backup" || true
          ls -la /var/backups/massovka-eu 2>/dev/null | tail -3
          for u in node_exporter victoria-metrics victoria-logs grafana systemd-journal-upload; do echo "· $u"; journalctl -u $u -n 4 --no-pager -o cat | tr '\\t' ' ' | cut -c1-220; done
          echo "── замер доступности (net_probe, всё время)"
          PGPASSWORD=$(. /etc/massovka-grafana/pgro.env; echo $PGRO_PASSWORD) psql -h 127.0.0.1 -p 25432 -U grafana_ro -d massovka -P pager=off -c "
            with p as (select device_id, props, case when props->>'cc'='RU' then 'RU без VPN'
              when props->>'tz' like 'Europe/Moscow' or props->>'tz' in ('Europe/Samara','Europe/Volgograd','Europe/Kaliningrad','Asia/Yekaterinburg','Asia/Novosibirsk','Asia/Omsk','Asia/Krasnoyarsk','Asia/Irkutsk','Asia/Vladivostok') then 'RU через VPN'
              when props->>'cc' is null then '?' else 'заграница' end as who from analytics_events where name='net_probe')
            select who, count(distinct device_id) tel, count(*) n,
              round(100.0*avg((props->>'msk_http')::int)) msk_http, round(100.0*avg((props->>'msk_big')::int)) msk_big, round(100.0*avg((props->>'msk_ws')::int)) msk_ws,
              round(100.0*avg((props->>'eu_http')::int)) eu_http, round(100.0*avg((props->>'eu_big')::int)) eu_big, round(100.0*avg((props->>'eu_ws')::int)) eu_ws,
              percentile_cont(0.5) within group (order by (props->>'msk_http_ms')::int) msk_ms, percentile_cont(0.5) within group (order by (props->>'eu_http_ms')::int) eu_ms
            from p group by 1 order by 2 desc" || true
          PGPASSWORD=$(. /etc/massovka-grafana/pgro.env; echo $PGRO_PASSWORD) psql -h 127.0.0.1 -p 25432 -U grafana_ro -d massovka -P pager=off -c "
            select props->>'cc' cc, count(distinct device_id) tel, round(100.0*avg((props->>'msk_ws')::int)) msk_ws, round(100.0*avg((props->>'eu_ws')::int)) eu_ws
            from analytics_events where name='net_probe' group by 1 order by 2 desc limit 15" || true
          PGPASSWORD=$(. /etc/massovka-grafana/pgro.env; echo $PGRO_PASSWORD) psql -h 127.0.0.1 -p 25432 -U grafana_ro -d massovka -P pager=off -c "
            select date_trunc('hour', created_at) h, count(distinct device_id) tel, count(*) filter (where name='match_start') matches
            from analytics_events where created_at > now() - interval '2 days' group by 1 order by 1 desc limit 48" || true
          echo "── клипы Telegram"
          ls -ld /var/lib/massovka-clips 2>&1; ls /var/lib/massovka-clips | wc -l
          echo "── туннель в Европу (:28080 → вход :8079 там): метрики да, внутренние маршруты нет"
          printf '/metrics: '; curl -s -m5 -o /dev/null -w '%{http_code}\n' http://127.0.0.1:28080/metrics
          printf '/internal/drain (ждём 404): '; curl -s -m5 -o /dev/null -w '%{http_code}\n' -X POST http://127.0.0.1:28080/internal/drain
          curl -s -m5 http://127.0.0.1:8428/api/v1/targets | jq -r '.data.activeTargets[] | "\(.labels.job // "?") \(.labels.server // "-") \(.scrapeUrl) \(.health) \(.lastError)"'
          echo "── сторож"
          systemctl list-timers massovka-watch.timer --no-pager | head -3
          curl -s -m5 --data-urlencode 'query={__name__=~"game_clips_.*",server="eu"}' http://127.0.0.1:8428/api/v1/query | jq -c '[.data.result[] | {(.metric.__name__): .value[1]}]'
          for f in /var/lib/massovka-watch/*; do echo "$(basename $f): $(cat $f) мин подряд не работает"; done
          journalctl -u massovka-watch -n 5 --no-pager -o cat | tail -3
          echo "── 20 попыток соединиться с Европой (по 3 с)"
          for port in 22 443 80; do
            ok=0; for i in $(seq 1 20); do timeout 3 bash -c "</dev/tcp/$MSK/$port" 2>/dev/null && ok=$((ok+1)); sleep 0.5; done
            echo "порт $port: $ok из 20"
          done
          echo "── то же к GitHub (для сравнения)"
          ok=0; for i in $(seq 1 10); do timeout 3 bash -c "</dev/tcp/140.82.112.3/443" 2>/dev/null && ok=$((ok+1)); done; echo "github 443: $ok из 10"
          ip -4 addr show | grep inet | grep -v 127.0.0 | awk '{print "свой адрес:", $2}'
          SH
      - name: Клипы на игровом сервере (с раннера)
        run: |
          curl -sS -m20 -w " ← клип: %{http_code}\n" https://api.benobody.app/v1/clips/00000000000000000000.mp4
          curl -sS -m20 -w " ← загрузка без токена: %{http_code}\n" -X POST -H 'content-type: video/mp4' --data-binary 'x' https://api.benobody.app/v1/clips
      - name: Клип целиком (загрузка, ссылка, карточка бота)
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          # настоящее видео h264 (карточку Telegram проверяет по содержимому)
          ffmpeg -loglevel error -f lavfi -i testsrc=size=360x640:rate=30 -t 3 -pix_fmt yuv420p -c:v libx264 /tmp/t.mp4 && export CLIP_FILE=/tmp/t.mp4 || true
          python3 infra/game/clip-check.py
      - name: Ошибки бота за 15 минут (Нидерланды)
        env:
          IP: ${{ steps.infra.outputs.ip }}
        run: ssh $SSH_OPTS root@$IP "journalctl -u 'massovka-game*' --since -15min --no-pager -o cat | grep -E 'tg_error|prepare' | tail -5 | cut -c1-400"
      # шлёт картинку и файлы в группу тревог и сразу удаляет — владельцу приходят уведомления о
      # «пропавших тревогах» (23.11.2026). Включать вручную: TG_REACH: '1' на время проверки.
      - name: Достаёт ли Telegram до наших серверов
        if: env.TG_REACH == '1'
        env:
          TOKEN: ${{ secrets.ALERTS_BOT_TOKEN }}
          CHAT: '-5387784292'
        run: python3 infra/game/tg-reach.py
      - name: Москва
        env:
          IP: ${{ steps.game.outputs.ip }}
        run: |
          ssh $SSH_OPTS root@$IP 'bash -s' <<'SH'
          ss -ltnp | grep -E ':9090|:8080|:3000|:5432' || true
          id tunnel; ls -la /var/lib/tunnel/.ssh/ 2>&1; cut -c1-70 /var/lib/tunnel/.ssh/authorized_keys
          journalctl -u ssh -n 20 --no-pager -o cat | grep -v "Accepted publickey for root" | tail -12
          sshd -T 2>/dev/null | grep -E "allowtcpforwarding|permitlisten|gatewayports" 
          free -m | head -2
          df -h / | tail -1 | awk '{print "диск Москвы: всего", $2, "занято", $3, "свободно", $4}'
          echo "клипов: $(ls /var/lib/massovka-clips 2>/dev/null | grep -c -E 'mp4|webm'), занимают $(du -sh /var/lib/massovka-clips 2>/dev/null | cut -f1)"
          echo "── 20 попыток соединиться с Нидерландами (по 3 с)"
          NL=${NL:-72.56.73.184}
          ok=0; for i in $(seq 1 20); do timeout 3 bash -c "</dev/tcp/$NL/443" 2>/dev/null && ok=$((ok+1)); sleep 0.5; done; echo "NL 443: $ok из 20"
          SH
      - name: Снаружи
        run: |
          for i in 1 2 3; do curl -s -m 10 -w " %{http_code} %{time_total}s\n" https://api.benobody.app/tg/info; sleep 2; done
          curl -s -m 10 -o /dev/null -w "benobody.app: %{http_code}\n" https://benobody.app/
