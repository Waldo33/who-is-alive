name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm sim -- --rounds 200
      # известные критичные уязвимости в зависимостях, которые едут в прод (docs/security.md)
      - run: pnpm audit --prod --audit-level critical
  native:
    # монтаж «Фильма матча» на Rust (apps/server/native): тесты холста и YUV, сверка кадров со Skia
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/server/native/target
          key: cargo-${{ hashFiles('apps/server/native/Cargo.lock') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kto/server test:native
      - run: pnpm --filter @kto/server build:native
      - run: cd apps/server && npx vitest run test/film-native.test.ts
  infra:
    # скрипты серверов: синтаксис bash и конфиг Caddy для всех схем (старая, синий/зелёный) — caddy validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: for f in infra/*.sh infra/game/*.sh infra/test/*.sh; do bash -n "$f" || exit 1; done
      # правила безопасности workflows: actions по SHA, секреты только в окружении production (docs/security.md)
      - run: python3 infra/test/workflows-check.py
      - run: python3 infra/test/keys-test.py
      - name: Caddy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # та же версия, что едет на серверы (infra/game/versions.env)
          . infra/game/versions.env
          tag=$CADDY_VERSION; v=${tag#v}
          gh release download "$tag" --repo caddyserver/caddy -p "caddy_${v}_linux_amd64.tar.gz" -D /tmp/caddy
          echo "$CADDY_SHA256  /tmp/caddy/caddy_${v}_linux_amd64.tar.gz" | sha256sum -c -
          tar -xzf "/tmp/caddy/caddy_${v}_linux_amd64.tar.gz" -C /tmp/caddy caddy
          REQUIRE_CADDY=1 CADDY_BIN=/tmp/caddy/caddy infra/test/caddy-config.sh
