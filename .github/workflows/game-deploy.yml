# Серверы в Timeweb Cloud: создать (если нет), настроить, выкатить новую версию сервера.
#   game/eu  — Европа (Нидерланды, massovka-eu): игра (api.benobody.app), сайт (benobody.app, выкладывает web-deploy),
#              Postgres с аналитикой.
#   infra    — Нидерланды: Telegram-бот (из России api.telegram.org закрыт), мониторинг, логи, копии базы.
# Код сервера один (apps/server), роль задают переменные окружения. Порядок: Европа (пускает туннель Нидерландов),
# infra (туннель к игровому серверу). Москва (massovka-game) выключена 25.11.2026 (docs/server-migration.md › 15).
# Всё идемпотентно. Логи Actions: секреты не печатаем (ключ SSH выводится из TWC_TOKEN внутри provision.py).
name: game-deploy

on:
  workflow_dispatch:
    inputs:
      skip_ci:
        description: 'Не ждать CI (только для аварийной выкладки)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'apps/server/**'
      - 'packages/net/**'
      - 'packages/game-core/**'
      - 'infra/game/**'
      # настройка машины — Ansible, его гоняет выкладка перед setup.sh
      - 'infra/ansible/**'
      # «Фильм матча» монтирует сервер теми же сценами, что телефон (apps/server/src/film-render.ts)
      - 'apps/web/src/game/**'
      - '.github/workflows/game-deploy.yml'
      - 'infra/ci-wait.sh'

concurrency:
  # одна выкладка за раз; ожидать может только одна — более новая отменяет ожидающую,
  # поэтому переезд (infra-move.yml) идёт в своей группе и сам ждёт, пока выкладка закончится
  group: game-deploy
  cancel-in-progress: false

permissions:
  contents: read
  # ci-wait.sh читает прогоны CI этого коммита
  actions: read

jobs:
  deploy:
    # стоп-кран: переменная репозитория DEPLOY_FREEZE=1 — push не выкладывает, только запуск вручную
    if: vars.DEPLOY_FREEZE != '1' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # секреты прода — только в окружении production, а оно пускает только ветку main (docs/security.md)
    environment: production
    timeout-minutes: 30
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - role: game
            site: eu
            name: massovka-eu
            # Cloud NL-30: 1 vCPU, 2 ГБ, 30 ГБ, Нидерланды, 1560 ₽ — как у massovka-infra, в том же
            # дата-центре (решение владельца 24.11.2026). NL-15 (950 ₽) создаётся без своего IPv4:
            # первый ушёл в error, второй с заказанным адресом так и не открыл SSH. Сломанный при
            # создании пересоздаётся. С 25.11.2026 — Cloud NL-40 (2 vCPU, 2 ГБ, 40 ГБ, 2600 ₽):
            # тариф живого сервера меняет Terraform (infra/terraform/servers.tf), здесь — для нового
            presets: '6809'
            recreate: '1'
          - role: infra
            name: massovka-infra
            # Cloud NL-30: 1 vCPU, 2 ГБ, 30 ГБ, Нидерланды, 1560 ₽ (решение владельца 23.11.2026)
            presets: '6807'
    env:
      TWC_TOKEN: ${{ secrets.TWC_TOKEN }}
      SERVER_NAME: ${{ matrix.name }}
      SERVER_PRESETS: ${{ matrix.presets }}
      ROLE: ${{ matrix.role }}
      RECREATE_BROKEN: ${{ matrix.recreate || '' }}
      # группа «benobody alerts» (id чата не секрет без ключа бота)
      ALERTS_CHAT: '-5387784292'
      SSH_OPTS: -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20 -o ServerAliveInterval=15 -o LogLevel=ERROR
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Тесты сервера
        run: pnpm --filter @kto/server test

      - name: Сборка
        run: pnpm --filter @kto/server build

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/server/native/target
          key: cargo-${{ hashFiles('apps/server/native/Cargo.lock') }}

      - name: Монтаж фильма на Rust
        # apps/server/native → dist/massovka-film.node: кадры и кодирование фильма (film-native.ts);
        # нет модуля или он упал — сервер монтирует прежним путём через Skia (film.ts › nativePath)
        working-directory: apps/server
        run: |
          pnpm test:native
          pnpm build:native
          npx vitest run test/film-native.test.ts

      - name: Нативные модули фильма матча
        # @napi-rs/canvas (кадры) и node-web-audio-api (звук) — готовые сборки под linux-x64;
        # процесс монтажа (film-worker.mjs) берёт их из node_modules рядом с собой
        working-directory: apps/server/dist
        run: |
          v() { node -p "require('../package.json').dependencies['$1']"; }
          printf '{"name":"film-natives","private":true}' > package.json
          npm install --no-save --no-package-lock --omit=dev "@napi-rs/canvas@$(v @napi-rs/canvas)" "node-web-audio-api@$(v node-web-audio-api)"
          rm package.json
          node --input-type=module -e "await import('@napi-rs/canvas'); await import('node-web-audio-api'); console.log('нативные модули грузятся')"
          tar -czf ../film.tar.gz node_modules fonts film-worker.mjs film-worker.mjs.map massovka-film.node
          ls -la ../film.tar.gz

      - name: Дождаться зелёного CI
        if: ${{ !inputs.skip_ci }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: infra/ci-wait.sh

      - name: Сервер в Timeweb (найти или создать)
        id: srv
        run: |
          python3 -m venv /tmp/py && /tmp/py/bin/pip install -q cryptography
          /tmp/py/bin/python infra/game/provision.py

      - name: Адрес сервера бота (его ключ туннеля — игровому серверу)
        id: infra
        if: matrix.role == 'game'
        env:
          SERVER_NAME: massovka-infra
          FIND_ONLY: '1'
        run: /tmp/py/bin/python infra/game/provision.py

      - name: Адрес сервера в Европе (туннель из Нидерландов)
        id: eu
        if: matrix.role == 'infra'
        env:
          SERVER_NAME: massovka-eu
          FIND_ONLY: '1'
        run: /tmp/py/bin/python infra/game/provision.py

      - name: Адрес (домен, если DNS уже смотрит на сервер)
        id: addr
        env:
          IP: ${{ steps.srv.outputs.ip }}
          SSLIP: ${{ steps.srv.outputs.host }}
          DOMAIN: ${{ matrix.role == 'game' && 'api.benobody.app' || '' }}
        run: |
          host=$SSLIP
          if [ -n "$DOMAIN" ]; then
            got=$(dig +short A "$DOMAIN" @8.8.8.8 | tail -1)
            echo "$DOMAIN → ${got:-нет записи} (сервер $IP)"
            if [ "$got" = "$IP" ]; then host=$DOMAIN; fi
          fi
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "основной адрес: $host"

      - name: Дождаться SSH
        env:
          IP: ${{ steps.srv.outputs.ip }}
        run: |
          for i in $(seq 1 30); do
            if ssh $SSH_OPTS root@$IP true 2>/dev/null; then echo "SSH есть"; exit 0; fi
            sleep 10
          done
          echo "::error::SSH не ответил"; exit 1

      - name: Что уже стоит на сервере
        id: have
        env:
          IP: ${{ steps.srv.outputs.ip }}
        run: |
          echo "node=$(ssh $SSH_OPTS root@$IP 'cat /opt/node/VERSION 2>/dev/null' || true)" >> "$GITHUB_OUTPUT"
          echo "caddy=$(ssh $SSH_OPTS root@$IP 'cat /etc/caddy/VERSION 2>/dev/null' || true)" >> "$GITHUB_OUTPUT"
          for b in node_exporter victoria-metrics victoria-logs grafana geoip; do
            echo "${b//-/_}=$(ssh $SSH_OPTS root@$IP "cat /etc/massovka/$b.version 2>/dev/null" || true)" >> "$GITHUB_OUTPUT"
          done

      - name: Привезти Node и Caddy (если нужно)
        env:
          GH_TOKEN: ${{ github.token }}
          HAVE_NODE: ${{ steps.have.outputs.node }}
          HAVE_CADDY: ${{ steps.have.outputs.caddy }}
          HAVE_GEOIP: ${{ steps.have.outputs.geoip }}
        run: |
          mkdir -p deploy
          # версии и суммы закреплены в infra/game/versions.env — «последнюю версию» выкладка не берёт
          . infra/game/versions.env
          # Node 22, проверка контрольной суммы из репозитория
          ver=$NODE_VERSION; file="node-$ver-linux-x64.tar.xz"
          if [ "$ver" != "$HAVE_NODE" ]; then
            echo "Node: $HAVE_NODE → $ver"
            curl -fsSL "https://nodejs.org/dist/$ver/$file" -o deploy/node.tar.xz
            echo "$NODE_SHA256  deploy/node.tar.xz" | sha256sum -c -
            echo "$ver" > deploy/node.version
          else echo "Node $ver уже стоит"; fi
          # Caddy — релиз с GitHub, проверка контрольной суммы из репозитория
          tag=$CADDY_VERSION
          if [ "$tag" != "$HAVE_CADDY" ]; then
            echo "Caddy: $HAVE_CADDY → $tag"
            v=${tag#v}
            gh release download "$tag" --repo caddyserver/caddy -p "caddy_${v}_linux_amd64.tar.gz" -D /tmp/caddy
            echo "$CADDY_SHA256  /tmp/caddy/caddy_${v}_linux_amd64.tar.gz" | sha256sum -c -
            tar -xzf "/tmp/caddy/caddy_${v}_linux_amd64.tar.gz" -C /tmp/caddy caddy
            mv /tmp/caddy/caddy deploy/caddy
            echo "$tag" > deploy/caddy.version
          else echo "Caddy $tag уже стоит"; fi
          # страна по адресу для замера доступности (apps/server/src/geo.ts): DB-IP Country Lite (CC BY 4.0)
          # из npm — db-ip.com из наших сред закрыт. Привозим, только если на сервере старая версия
          gv=$GEOIP_VERSION
          if [ -n "$gv" ] && [ "$gv" != "$HAVE_GEOIP" ]; then
            echo "GeoIP: $HAVE_GEOIP → $gv"
            (cd /tmp && npm pack "@ip-location-db/dbip-country-mmdb@$gv" >/dev/null && tar -xzf ip-location-db-dbip-country-mmdb-*.tgz package/dbip-country.mmdb)
            mv /tmp/package/dbip-country.mmdb deploy/geoip.mmdb
            echo "$gv" > deploy/geoip.version
          else echo "GeoIP ${gv:-?} уже стоит"; fi
          cp apps/server/dist/server.mjs apps/server/dist/server.mjs.map apps/server/film.tar.gz infra/game/setup.sh infra/game/observe.sh deploy/
          ls -la deploy

      - name: Привезти наблюдение (если нужно)
        env:
          GH_TOKEN: ${{ github.token }}
          HAVE_NE: ${{ steps.have.outputs.node_exporter }}
          HAVE_VM: ${{ steps.have.outputs.victoria_metrics }}
          HAVE_VL: ${{ steps.have.outputs.victoria_logs }}
          HAVE_GF: ${{ steps.have.outputs.grafana }}
        run: |
          set -e
          d=$(mktemp -d)
          # версии и суммы закреплены в infra/game/versions.env
          . infra/game/versions.env
          # node_exporter — обоим серверам
          tag=$NODE_EXPORTER_VERSION
          if [ "$tag" != "$HAVE_NE" ]; then
            v=${tag#v}
            gh release download "$tag" --repo prometheus/node_exporter -p "node_exporter-$v.linux-amd64.tar.gz" -D "$d"
            echo "$NODE_EXPORTER_SHA256  $d/node_exporter-$v.linux-amd64.tar.gz" | sha256sum -c -
            tar -xzf "$d/node_exporter-$v.linux-amd64.tar.gz" -C "$d"
            cp "$d/node_exporter-$v.linux-amd64/node_exporter" deploy/node_exporter; echo "$tag" > deploy/node_exporter.version
            echo "node_exporter: $HAVE_NE → $tag"
          fi
          [ "$ROLE" = infra ] || exit 0
          # VictoriaMetrics и VictoriaLogs — однофайловые, из релизов GitHub
          tag=$VICTORIA_METRICS_VERSION
          if [ "$tag" != "$HAVE_VM" ]; then
            gh release download "$tag" --repo VictoriaMetrics/VictoriaMetrics -p "victoria-metrics-linux-amd64-$tag.tar.gz" -D "$d"
            echo "$VICTORIA_METRICS_SHA256  $d/victoria-metrics-linux-amd64-$tag.tar.gz" | sha256sum -c -
            tar -xzf "$d/victoria-metrics-linux-amd64-$tag.tar.gz" -C "$d"
            cp "$d/victoria-metrics-prod" deploy/victoria-metrics; echo "$tag" > deploy/victoria-metrics.version
            echo "VictoriaMetrics: $HAVE_VM → $tag"
          fi
          tag=$VICTORIA_LOGS_VERSION
          if [ "$tag" != "$HAVE_VL" ]; then
            if gh release download "$tag" --repo VictoriaMetrics/VictoriaLogs -p "victoria-logs-linux-amd64-$tag.tar.gz" -D "$d"; then
              echo "$VICTORIA_LOGS_SHA256  $d/victoria-logs-linux-amd64-$tag.tar.gz" | sha256sum -c -
              tar -xzf "$d/victoria-logs-linux-amd64-$tag.tar.gz" -C "$d"
              cp "$d/victoria-logs-prod" deploy/victoria-logs; echo "$tag" > deploy/victoria-logs.version
              echo "VictoriaLogs: $HAVE_VL → $tag"
            else
              echo "::warning::VictoriaLogs $tag: нет файла для linux-amd64"; gh release view "$tag" --repo VictoriaMetrics/VictoriaLogs --json assets -q '[.assets[].name] | join(" ")' | head -c 600
            fi
          fi
          # Grafana OSS
          tag=$GRAFANA_VERSION
          if [ "$tag" != "$HAVE_GF" ]; then
            v=${tag#v}
            curl -fsSL "https://dl.grafana.com/oss/release/grafana-$v.linux-amd64.tar.gz" -o deploy/grafana.tar.gz
            sum=$GRAFANA_SHA256
            [ -n "$sum" ] || sum=$(curl -fsSL "https://dl.grafana.com/oss/release/grafana-$v.linux-amd64.tar.gz.sha256" | grep -oE '^[0-9a-f]{64}')
            echo "Grafana $tag sha256: $sum"
            echo "$sum  deploy/grafana.tar.gz" | sha256sum -c -
            echo "$tag" > deploy/grafana.version
            echo "Grafana: $HAVE_GF → $tag"
          fi
          mkdir -p deploy/dashboards && cp infra/grafana/*.json deploy/dashboards/
          ls -la deploy

      - name: Матч через выкладку (старт)
        # синий/зелёный (docs/infra-plan.md › этап 1): четверо играют, пока выкатывается новая версия;
        # матч обязан доиграться без «комната закрыта». На старой схеме (одна служба) — пропуск
        if: matrix.role == 'game' && steps.addr.outputs.host != ''
        id: through
        env:
          IP: ${{ steps.srv.outputs.ip }}
          HOST: ${{ steps.addr.outputs.host }}
        run: |
          if ssh $SSH_OPTS root@$IP 'test -s /etc/massovka/active-color'; then
            ( SMOKE_THROUGH=1 SMOKE_PLAY_MS=150000 pnpm --filter @kto/server smoke "https://$HOST" > /tmp/through.log 2>&1; echo $? > /tmp/through.rc ) &
            echo "on=1" >> "$GITHUB_OUTPUT"
            sleep 15
            head -5 /tmp/through.log || true
          else
            echo "старая схема — проверка «через выкладку» начнётся со следующей выкладки"
          fi

      - name: Настройка машины (Ansible)
        # infra/ansible/site.yml только для этого сервера: система, Postgres, туннели, сторож, game.env,
        # службы. Перезапуска игры здесь нет: поменялась настройка — роль оставляет метку, и setup.sh
        # ниже поднимает новый экземпляр синим/зелёным, без обрыва матчей
        working-directory: infra/ansible
        env:
          ALERTS_BOT_TOKEN: ${{ matrix.role == 'infra' && secrets.ALERTS_BOT_TOKEN || '' }}
          NAME: ${{ matrix.name }}
        run: |
          /tmp/py/bin/pip install -q ansible-core==2.17.7
          /tmp/py/bin/python inventory.py
          /tmp/py/bin/ansible-playbook site.yml --limit "$NAME" --diff

      - name: Настроить и выкатить
        env:
          IP: ${{ steps.srv.outputs.ip }}
          HOST: ${{ steps.addr.outputs.host }}
          SSLIP: ${{ steps.srv.outputs.host }}
          BOT_IP: ${{ steps.infra.outputs.ip }}
          EU_IP: ${{ steps.eu.outputs.ip }}
          SITE: ${{ matrix.site }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GRAFANA_PASSWORD: ${{ secrets.GRAFANA_PASSWORD }}
          # ключи S3 из панели Timeweb (если заданы) — s3-env.py пробует их первыми
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
        run: |
          ssh $SSH_OPTS root@$IP 'rm -rf /tmp/deploy && mkdir -p /tmp/deploy'
          # ключ бота — только серверу бота, файлом по SSH (не в командной строке и не в логах)
          if [ "$ROLE" = infra ] && [ -n "$TG_TOKEN" ]; then
            ( umask 077; printf 'TELEGRAM_BOT_TOKEN=%s\n' "$TG_TOKEN" > deploy/bot.env )
          fi
          # пароль роли базы «только чтение» (Grafana и копии): выводится из TWC_TOKEN — Москва и Нидерланды
          # получают одно и то же, отдельного секрета не нужно
          ( umask 077; python3 -c 'import hmac,hashlib,os;print("PGRO_PASSWORD="+hmac.new(os.environ["TWC_TOKEN"].encode(),b"massovka-pgro-v1",hashlib.sha256).hexdigest()[:40])' > deploy/pgro.env )
          if [ "$ROLE" = infra ] && [ -n "$GRAFANA_PASSWORD" ]; then ( umask 077; printf '%s' "$GRAFANA_PASSWORD" > deploy/grafana_admin ); fi
          # ключи S3 для клипов и фильмов — игре в Европе, из API Timeweb по TWC_TOKEN (бакета нет — файла нет)
          if [ "$SITE" = eu ]; then python3 infra/game/s3-env.py deploy/s3.env || echo "::warning::S3: ключи не получены — клипы на диске"; fi
          # бот тревог (alerts.env) кладёт Ansible — шагом выше
          # открытый ключ туннеля сервера бота — игровому серверу (вход только для проброса порта)
          if [ "$ROLE" = game ] && [ -n "$BOT_IP" ]; then
            ssh $SSH_OPTS root@$BOT_IP 'cat /etc/massovka/tunnel_ed25519.pub 2>/dev/null' > deploy/tunnel.pub || true
          fi
          scp $SSH_OPTS -q -r deploy/* root@$IP:/tmp/deploy/
          if [ "$SITE" = eu ]; then
            # Европа: основной адрес — api.benobody.app, запасной — свой sslip.io;
            # переезд комнат при выкладке — на тот адрес, что сейчас работает снаружи (до DNS — sslip.io)
            up=""; [ -s deploy/tunnel.pub ] && up="http://127.0.0.1:9090"
            vars="HOST=api.benobody.app ALT_HOST=$SSLIP PEER_HOST=$HOST WS_HOSTS=api.benobody.app,$SSLIP REGION=eu SITE_HOST=benobody.app SITE_REDIRECT=https://who-is-alive.vercel.app BOT_UPSTREAM=$up"
          elif [ "$ROLE" = game ]; then
            up=""; [ -s deploy/tunnel.pub ] && up="http://127.0.0.1:9090"
            vars="HOST=$HOST ALT_HOST=$SSLIP SITE_HOST=benobody.app SITE_REDIRECT=https://who-is-alive.vercel.app BOT_UPSTREAM=$up"
          else
            # игра живёт в Европе (переезд 24.11): аналитика с замера — туда (туннель :28080), Grafana,
            # копии базы и сторож — тоже туда
            vars="HOST=$HOST BOT_SITE=https://benobody.app TUNNEL_EU_TO=$EU_IP GAME_SITE=eu EVENTS_TO=28080"
          fi
          ssh $SSH_OPTS root@$IP "ANSIBLE=1 ROLE=$ROLE $vars SHA=${GITHUB_SHA::12} bash /tmp/deploy/setup.sh"

      - name: HTTPS снаружи
        env:
          HOST: ${{ steps.addr.outputs.host }}
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "https://$HOST/healthz"; then echo; exit 0; fi
            sleep 5
          done
          echo "::error::https://$HOST/healthz не отвечает"
          exit 1

      - name: Telegram-бот (вебхук на сервер бота)
        if: matrix.role == 'infra'
        continue-on-error: true
        env:
          HOST: ${{ steps.addr.outputs.host }}
          IP: ${{ steps.srv.outputs.ip }}
          HAS_TG: ${{ secrets.TELEGRAM_BOT_TOKEN != '' }}
        run: |
          if [ "$HAS_TG" != true ]; then echo "TELEGRAM_BOT_TOKEN не задан в GitHub Secrets — бот остаётся в Supabase"; exit 0; fi
          # сразу после перезапуска первый запрос к Telegram бывает неудачным — несколько попыток;
          # бот не должен останавливать выкладку игры
          info=""
          for i in $(seq 1 6); do info=$(curl -fsS "https://$HOST/tg/info") && break; sleep 5; done
          if [ -z "$info" ]; then echo "::warning::бот не отвечает (api.telegram.org?) — вебхук не трогаю"; exit 0; fi
          echo "бот: $info"
          # /tg/setup и /tg/status снаружи закрыты (server.ts) — изнутри машины, через внутренний вход Caddy
          ssh $SSH_OPTS root@$IP 'curl -fsS http://127.0.0.1:8080/tg/setup'; echo
          ssh $SSH_OPTS root@$IP 'curl -fsS http://127.0.0.1:8080/tg/status'; echo

      - name: Игровой сервер → бот (/tg/* проксируется на сервер бота)
        if: matrix.role == 'game' && steps.infra.outputs.host != ''
        # Европа в первый раз: туннель из Нидерландов появится, когда следом выкатится infra
        continue-on-error: ${{ matrix.site == 'eu' }}
        env:
          HOST: ${{ steps.addr.outputs.host }}
        run: |
          for i in $(seq 1 20); do
            if res=$(curl -fsS "https://$HOST/tg/info"); then echo "через $HOST: $res"; exit 0; fi
            sleep 5
          done
          echo "::error::https://$HOST/tg/info не отвечает (туннель из Нидерландов?)"; exit 1

      - name: Сайт benobody.app
        if: matrix.role == 'game'
        env:
          IP: ${{ steps.srv.outputs.ip }}
        run: |
          # именно этого сервера (DNS может смотреть на другой): --resolve
          for h in benobody.app www.benobody.app api.benobody.app; do
            path=/; [ "$h" = api.benobody.app ] && path=/healthz
            printf '%s → ' "$h"; curl -s --resolve "$h:443:$IP" -o /dev/null -w '%{http_code} %{redirect_url}\n' "https://$h$path" || echo "нет HTTPS" 
          done

      - name: Матч через выкладку (итог)
        if: always() && steps.through.outputs.on == '1'
        run: |
          for _ in $(seq 1 60); do [ -f /tmp/through.rc ] && break; sleep 5; done
          cat /tmp/through.log || true
          test "$(cat /tmp/through.rc 2>/dev/null)" = 0 || { echo "::error::матч оборвался на выкладке (или не доигрался за 5 минут)"; exit 1; }

      - name: Живой прогон (4 игрока, ~30 с)
        if: matrix.role == 'game'
        env:
          HOST: ${{ steps.addr.outputs.host }}
        run: pnpm --filter @kto/server smoke "https://$HOST"

      - name: Фильм матча на сервере (самопроверка)
        # матч с ИИ и монтаж фильма прямо на сервере, тем же процессом, что после матчей у игроков:
        # нативные модули, ffmpeg, шрифты и время на этом vCPU. Не вышло — игроки монтируют на телефоне
        if: matrix.role == 'game'
        env:
          IP: ${{ steps.srv.outputs.ip }}
        run: |
          out=$(ssh $SSH_OPTS root@$IP 'cd /opt/massovka/color/$(cat /etc/massovka/active-color) && command -v ffmpeg >/dev/null && free -m | head -2 && runuser -u game -- nice -n 15 /opt/node/bin/node film-worker.mjs --selftest' 2>&1) && ok=1 || ok=0
          echo "$out" | tail -8
          if [ "$ok" = 1 ]; then echo "фильм: $(echo "$out" | tail -1)" >> "$GITHUB_STEP_SUMMARY"
          else echo "::warning::фильм матча на сервере не смонтировался — игроки монтируют на телефоне"; fi
          # клип выбывшего: тот же монтаж, короче (телефон пишет его 13–16 с в реальном времени)
          out=$(ssh $SSH_OPTS root@$IP 'cd /opt/massovka/color/$(cat /etc/massovka/active-color) && runuser -u game -- nice -n 15 /opt/node/bin/node film-worker.mjs --selftest-clip' 2>&1) && ok=1 || ok=0
          echo "$out" | tail -4
          if [ "$ok" = 1 ]; then echo "клип выбывшего: $(echo "$out" | tail -1)" >> "$GITHUB_STEP_SUMMARY"
          else echo "::warning::клип выбывшего на сервере не смонтировался — игроки пишут его на телефоне"; fi

      - name: Логи сервера (последние)
        if: always() && steps.srv.outputs.ip != ''
        env:
          IP: ${{ steps.srv.outputs.ip }}
        run: |
          ssh $SSH_OPTS root@$IP 'journalctl -u 'massovka-game*' -u caddy -u massovka-tunnel-eu -n 60 --no-pager -o cat' | grep -v -E '"(remote_ip|client_ip)"' | cut -c1-300 || true

      - name: Итог
        if: success()
        env:
          HOST: ${{ steps.addr.outputs.host }}
        run: |
          echo "### ${{ matrix.role }}: https://$HOST" >> "$GITHUB_STEP_SUMMARY"
          echo "версия ${GITHUB_SHA::12}" >> "$GITHUB_STEP_SUMMARY"

      - name: Тревога о неудачной выкладке
        if: failure()
        env:
          TOKEN: ${{ secrets.ALERTS_BOT_TOKEN }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$TOKEN" ] || exit 0
          text="🔴 Выкладка сервера (${{ matrix.role }}) не прошла: $(git log -1 --format=%s | cut -c1-80)
          $URL"
          curl -s -m 15 -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" -H 'Content-Type: application/json' \
            -d "$(jq -nc --arg c "$ALERTS_CHAT" --arg t "$text" '{chat_id: $c, text: $t, disable_web_page_preview: true}')" >/dev/null || true
