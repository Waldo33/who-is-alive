# Временная диагностика (удалить после разбора): события клипов и фильма матча из журнала игрового сервера.
name: clip-logs

on:
  push:
    branches: [claude/project-thread-9rggqq]
    paths: ['.github/workflows/clip-logs.yml']

permissions:
  contents: read

jobs:
  logs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TWC_TOKEN: ${{ secrets.TWC_TOKEN }}
      SSH_OPTS: -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20 -o LogLevel=ERROR
      FIND_ONLY: '1'
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m venv /tmp/py && /tmp/py/bin/pip install -q cryptography
      - id: eu
        env: { SERVER_NAME: massovka-eu }
        run: /tmp/py/bin/python infra/game/provision.py
      - name: Журнал
        env:
          IP: ${{ steps.eu.outputs.ip }}
        run: |
          ssh $SSH_OPTS root@$IP 'journalctl -u "massovka-game*" --since "2026-11-25 10:30" --until "2026-11-25 11:20" --no-pager -o short-iso | grep -E "clip|film|match_start|match_end|native|worker|rror|warn" | grep -v -E "\"(remote_ip|client_ip)\"" | cut -c1-900 | tail -150'
