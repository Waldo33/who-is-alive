# Сайт на своём сервере: сборка Next.js (standalone) в Actions, заливка и перезапуск на сервере.
# Сервер и Caddy настраивает game-deploy; здесь — только версия сайта.
name: web-deploy

on:
  workflow_dispatch:
    inputs:
      skip_ci:
        description: 'Не ждать CI (только для аварийной выкладки)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'infra/game/web.sh'
      - 'infra/game/caddy.sh'
      - '.github/workflows/web-deploy.yml'
      - 'infra/ci-wait.sh'

concurrency:
  group: web-deploy
  cancel-in-progress: false

permissions:
  contents: read
  # ci-wait.sh читает прогоны CI этого коммита
  actions: read

jobs:
  deploy:
    # стоп-кран: переменная репозитория DEPLOY_FREEZE=1 — push не выкладывает, только запуск вручную
    if: vars.DEPLOY_FREEZE != '1' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      # на время переезда сайт живёт на обоих серверах (docs/infra-plan.md › этап 3): сначала Европа;
      # новый сервер настраивает game-deploy — сайт ждёт его до 25 минут
      max-parallel: 1
      fail-fast: false
      matrix:
        server: [massovka-eu, massovka-game]
    env:
      TWC_TOKEN: ${{ secrets.TWC_TOKEN }}
      SERVER_NAME: ${{ matrix.server }}
      SSH_OPTS: -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20 -o ServerAliveInterval=15 -o LogLevel=ERROR
      SITE: benobody.app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Сборка сайта
        env:
          NEXT_STANDALONE: '1'
          NEXT_PUBLIC_SITE_URL: https://benobody.app
          # версия сайта в отчётах об ошибках с телефонов (lib/errors.ts)
          NEXT_PUBLIC_BUILD: ${{ github.sha }}
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          pnpm --filter web build
          cd apps/web
          # статика и public в standalone не входят — кладём рядом с server.js
          cp -r .next/static .next/standalone/apps/web/.next/static
          cp -r public .next/standalone/apps/web/public
          tar -czf /tmp/web.tar.gz -C .next/standalone .
          ls -la /tmp/web.tar.gz

      - name: Дождаться зелёного CI
        if: ${{ !inputs.skip_ci }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: infra/ci-wait.sh

      - name: Сервер
        id: srv
        env:
          # только найти: серверы создаёт game-deploy
          FIND_ONLY: '1'
        run: |
          python3 -m venv /tmp/py && /tmp/py/bin/pip install -q cryptography
          /tmp/py/bin/python infra/game/provision.py

      - name: Дождаться настройки сервера (новый сервер настраивает game-deploy)
        if: steps.srv.outputs.ip != ''
        env:
          IP: ${{ steps.srv.outputs.ip }}
        run: |
          for _ in $(seq 1 50); do
            ssh $SSH_OPTS root@$IP 'test -s /etc/massovka/hosts.env && test -x /opt/node/bin/node' 2>/dev/null && { echo "сервер готов"; exit 0; }
            sleep 30
          done
          echo "::error::сервер не настроен за 25 минут"; exit 1

      - name: Залить и перезапустить
        if: steps.srv.outputs.ip != ''
        env:
          IP: ${{ steps.srv.outputs.ip }}
        run: |
          ssh $SSH_OPTS root@$IP 'rm -rf /tmp/deploy-web && mkdir -p /tmp/deploy-web'
          scp $SSH_OPTS -q /tmp/web.tar.gz infra/game/web.sh infra/game/caddy.sh root@$IP:/tmp/deploy-web/
          ssh $SSH_OPTS root@$IP "SHA=${GITHUB_SHA::12} bash /tmp/deploy-web/web.sh"

      - name: Проверка снаружи
        if: steps.srv.outputs.ip != ''
        env:
          IP: ${{ steps.srv.outputs.ip }}
        run: |
          # именно этот сервер, куда бы ни смотрел DNS
          c() { curl -s --resolve "$SITE:443:$IP" --retry 3 --retry-all-errors "$@"; }
          for i in $(seq 1 20); do
            code=$(c -o /dev/null -w '%{http_code}' "https://$SITE/" || true)
            [ "$code" = 200 ] && break
            sleep 5
          done
          for p in / /sandbox /r/ABCD /manifest.webmanifest "/og?l=ru" /icons/icon-192.png; do
            printf '%-24s ' "$p"; c -o /dev/null -w '%{http_code} %{size_download}B %{time_total}s\n' "https://$SITE$p"
          done
          test "$(c -o /dev/null -w '%{http_code}' "https://$SITE/")" = 200
          test "$(c -o /dev/null -w '%{http_code}' "https://$SITE/sandbox")" = 200

      - name: Логи сайта
        if: always() && steps.srv.outputs.ip != ''
        env:
          IP: ${{ steps.srv.outputs.ip }}
        run: ssh $SSH_OPTS root@$IP "journalctl -u 'massovka-web*' -n 40 --no-pager -o cat" | cut -c1-300 || true

      - name: Тревога о неудачной выкладке
        if: failure()
        env:
          TOKEN: ${{ secrets.ALERTS_BOT_TOKEN }}
          CHAT: '-5387784292'
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$TOKEN" ] || exit 0
          text="🔴 Выкладка сайта (${{ matrix.server }}) не прошла: $(git log -1 --format=%s | cut -c1-80)
          $URL"
          curl -s -m 15 -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" -H 'Content-Type: application/json' \
            -d "$(jq -nc --arg c "$CHAT" --arg t "$text" '{chat_id: $c, text: $t, disable_web_page_preview: true}')" >/dev/null || true

