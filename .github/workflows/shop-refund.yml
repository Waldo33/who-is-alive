# Возврат звёзд за покупку в гардеробе (apps/server/src/shop.ts › refund): звёзды — игроку, набор забирается,
# скин пропадает, стикеры набора удаляются из его пака. Запуск: Actions → shop-refund → Run workflow →
# номер покупателя (Telegram id — его присылает бот в чат поддержки после /paysupport) и, если покупок несколько, что
# вернуть (kotBanan…); или сразу charge id платежа. Несколько покупок без выбора — список в итогах запуска, возврата нет.
name: shop-refund

on:
  workflow_dispatch:
    inputs:
      who:
        description: 'Telegram id игрока (последняя покупка) или charge id платежа'
        required: true
        type: string
      item:
        description: 'Что вернуть, если покупок несколько (например kotBanan); пусто — единственную'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: shop-refund
  cancel-in-progress: false

jobs:
  refund:
    runs-on: ubuntu-latest
    # секреты прода — только в окружении production, а оно пускает только ветку main (docs/security.md)
    environment: production
    timeout-minutes: 5
    env:
      TWC_TOKEN: ${{ secrets.TWC_TOKEN }}
      SSH_OPTS: -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20 -o LogLevel=ERROR
      FIND_ONLY: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Проверить ввод
        env:
          WHO: ${{ inputs.who }}
          ITEM: ${{ inputs.item }}
        run: |
          echo "$ITEM" | grep -Eq '^[A-Za-z0-9]{0,32}$' || { echo "::error::покупка — имя набора, например kotBanan"; exit 1; }
          # только цифры (Telegram id) или символы charge id — ничего лишнего в команду на сервере
          echo "$WHO" | grep -Eq '^([0-9]{1,16}|[][!#%&()*+,./0-9:;<=>?@A-Z^_a-z{|}~-]{1,256})$' || { echo "::error::нужен Telegram id или charge id"; exit 1; }
      - run: python3 -m venv /tmp/py && /tmp/py/bin/pip install -q cryptography
      - id: infra
        env: { SERVER_NAME: massovka-infra }
        run: /tmp/py/bin/python infra/game/provision.py
      - name: Вернуть
        env:
          IP: ${{ steps.infra.outputs.ip }}
          WHO: ${{ inputs.who }}
          ITEM: ${{ inputs.item }}
        run: |
          ssh $SSH_OPTS root@$IP "WHO='$WHO' ITEM='$ITEM' bash -s" <<'SH' | tee /tmp/out.txt
          set -e
          charge="$WHO"
          if echo "$WHO" | grep -Eq '^[0-9]{1,16}$'; then
            # покупки — в базе игры (Европа), отсюда — по туннелю, только чтение
            filter=""
            [ -z "$ITEM" ] || filter="and item = '$ITEM'"
            list=$(PGPASSWORD=$(. /etc/massovka-grafana/pgro.env; echo $PGRO_PASSWORD) psql -h 127.0.0.1 -p 25432 -U grafana_ro -d massovka -AtF ' ' -c \
              "select charge, item, stars, to_char(created_at, 'YYYY-MM-DD HH24:MI') from shop_payments where user_id = $WHO and not refunded $filter order by created_at desc")
            [ -n "$list" ] || { echo "у игрока $WHO нет невозвращённых покупок ${ITEM:+«$ITEM»}"; exit 1; }
            if [ "$(echo "$list" | wc -l)" -gt 1 ]; then
              echo "LIST"; echo "$list"; exit 0
            fi
            charge=$(echo "$list" | cut -d' ' -f1)
          fi
          # бот — в этом же процессе игрового сервера Нидерландов, вход /internal — только изнутри машины
          printf '%s' "{\"charge\":\"$charge\"}" | curl -sS -m 30 -X POST -H 'Content-Type: application/json' --data-binary @- -w '\nHTTP %{http_code}\n' http://127.0.0.1:8080/internal/tg/refund
          SH
          if grep -q '^LIST$' /tmp/out.txt; then
            { echo "У игрока несколько покупок — запусти ещё раз и укажи, что вернуть (поле «Что вернуть») или charge id:"; echo; echo '| charge | что | звёзды | когда (UTC) |'; echo '|---|---|---|---|'
              sed '1,/^LIST$/d' /tmp/out.txt | awk '{print "| " $1 " | " $2 " | " $3 " | " $4 " " $5 " |"}'; } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::несколько покупок — выбери, что вернуть (список в итогах запуска)"; exit 1
          fi
          grep -q '^HTTP 200' /tmp/out.txt || { echo "::error::возврат не прошёл"; exit 1; }
          echo "возврат: $(head -1 /tmp/out.txt)" >> "$GITHUB_STEP_SUMMARY"
