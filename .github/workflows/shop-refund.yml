# Возврат звёзд за покупку в гардеробе (apps/server/src/shop.ts › refund): звёзды — игроку, набор забирается,
# скин пропадает, стикеры набора удаляются из его пака. Запуск: Actions → shop-refund → Run workflow →
# Telegram id игрока (вернётся его последняя невозвращённая покупка) или charge id платежа.
# Свой Telegram id можно узнать у @userinfobot.
name: shop-refund

on:
  workflow_dispatch:
    inputs:
      who:
        description: 'Telegram id игрока (последняя покупка) или charge id платежа'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: shop-refund
  cancel-in-progress: false

jobs:
  refund:
    runs-on: ubuntu-latest
    # секреты прода — только в окружении production, а оно пускает только ветку main (docs/security.md)
    environment: production
    timeout-minutes: 5
    env:
      TWC_TOKEN: ${{ secrets.TWC_TOKEN }}
      SSH_OPTS: -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20 -o LogLevel=ERROR
      FIND_ONLY: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Проверить ввод
        env:
          WHO: ${{ inputs.who }}
        run: |
          # только цифры (Telegram id) или символы charge id — ничего лишнего в команду на сервере
          echo "$WHO" | grep -Eq '^([0-9]{1,16}|[A-Za-z0-9_:.-]{1,128})$' || { echo "::error::нужен Telegram id или charge id"; exit 1; }
      - run: python3 -m venv /tmp/py && /tmp/py/bin/pip install -q cryptography
      - id: infra
        env: { SERVER_NAME: massovka-infra }
        run: /tmp/py/bin/python infra/game/provision.py
      - name: Вернуть
        env:
          IP: ${{ steps.infra.outputs.ip }}
          WHO: ${{ inputs.who }}
        run: |
          ssh $SSH_OPTS root@$IP "WHO='$WHO' bash -s" <<'SH' | tee /tmp/out.txt
          set -e
          charge="$WHO"
          if echo "$WHO" | grep -Eq '^[0-9]{1,16}$'; then
            # покупки — в базе игры (Европа), отсюда — по туннелю, только чтение
            charge=$(PGPASSWORD=$(. /etc/massovka-grafana/pgro.env; echo $PGRO_PASSWORD) psql -h 127.0.0.1 -p 25432 -U grafana_ro -d massovka -Atc \
              "select charge from shop_payments where user_id = $WHO and not refunded order by created_at desc limit 1")
            [ -n "$charge" ] || { echo "у игрока $WHO нет невозвращённых покупок"; exit 1; }
          fi
          # бот — в этом же процессе игрового сервера Нидерландов, вход /internal — только изнутри машины
          printf '%s' "{\"charge\":\"$charge\"}" | curl -sS -m 30 -X POST -H 'Content-Type: application/json' --data-binary @- -w '\nHTTP %{http_code}\n' http://127.0.0.1:8080/internal/tg/refund
          SH
          grep -q '^HTTP 200' /tmp/out.txt || { echo "::error::возврат не прошёл"; exit 1; }
          echo "возврат: $(head -1 /tmp/out.txt)" >> "$GITHUB_STEP_SUMMARY"
