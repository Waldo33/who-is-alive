# Серверы в Timeweb Cloud из кода (infra/terraform, docs/terraform.md).
#   push в main с правкой infra/terraform (на PR секретов прода нет — docs/security.md) — только план (ничего не меняется); сводка — в Summary прогона.
#   Применить — вручную: Actions › infra-terraform › Run workflow, apply = true (лучше ночью: смена тарифа
#   перезагружает сервер, матчи и сайт рвутся до ~10 минут (25.11 NL-30 → NL-40: 9 минут)). Удаление и пересоздание серверов запрещены.
# Состояние Terraform не хранится: перед каждым запуском discover.py находит живые серверы, и они подхватываются import'ом.
name: infra-terraform

on:
  push:
    branches: [main]
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/infra-terraform.yml'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Применить план (иначе только показать)'
        type: boolean
        default: false

concurrency:
  # один Terraform за раз, применение не отменяется
  group: infra-terraform
  cancel-in-progress: false

permissions:
  contents: read
  # после применения — запустить game-deploy (setup.sh пересчитывает потолок комнат и память под машину)
  actions: write

jobs:
  terraform:
    runs-on: ubuntu-latest
    # секреты прода — только в окружении production, а оно пускает только ветку main (docs/security.md)
    environment: production
    timeout-minutes: 30
    defaults:
      run:
        working-directory: infra/terraform
        # pipefail: иначе ошибка terraform или стоп summary.py терялись бы в | grep / | tee
        shell: bash -eo pipefail {0}
    env:
      TWC_TOKEN: ${{ secrets.TWC_TOKEN }}
      TF_IN_AUTOMATION: '1'
      TF_INPUT: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Формат
        run: terraform fmt -check -diff

      - name: Какие серверы уже есть
        run: |
          python3 -m venv /tmp/py && /tmp/py/bin/pip install -q cryptography
          /tmp/py/bin/python discover.py

      - name: init
        run: terraform init

      - name: Подхватить живые серверы (состояние из Timeweb)
        run: ./import.sh

      - name: План
        run: |
          terraform plan -out=plan.tfplan -no-color | grep -v -i 'root_pass\|vnc_pass'
          terraform show -json plan.tfplan > plan.json

      - name: Сводка (удаление и пересоздание — стоп)
        run: python3 summary.py < plan.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Применить
        if: github.event_name == 'workflow_dispatch' && inputs.apply && github.ref == 'refs/heads/main'
        run: |
          terraform apply -no-color plan.tfplan | grep -v -i 'root_pass\|vnc_pass'
          terraform output -json servers | python3 -c 'import json,sys; [print(k, v["name"], "тариф", v["preset"], v["cpu"], "vCPU", v["ram"], "МБ", v["ipv4"]) for k, v in json.load(sys.stdin).items()]'

      - name: Перевыложить игру под новую машину
        if: github.event_name == 'workflow_dispatch' && inputs.apply && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run game-deploy.yml --ref main -R "$GITHUB_REPOSITORY"
          echo "game-deploy запущен — Actions › game-deploy" | tee -a "$GITHUB_STEP_SUMMARY"
