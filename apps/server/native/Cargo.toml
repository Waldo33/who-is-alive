[package]
name = "massovka-film"
version = "0.1.0"
edition = "2021"
publish = false
description = "Монтаж «Фильма матча»: пиксельный холст, перевод в YUV и кодирование (нативный модуль для Node)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fontdue = "0.9.5"
miniz_oxide = "0.9.1"
jpeg-encoder = "0.6"
napi = { version = "3", default-features = false, features = ["napi4"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
