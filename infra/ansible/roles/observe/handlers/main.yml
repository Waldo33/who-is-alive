- name: перезапустить node_exporter
  ansible.builtin.systemd_service: { name: node_exporter, state: restarted, daemon_reload: true }
- name: перезапустить journal-upload
  ansible.builtin.systemd_service: { name: systemd-journal-upload, state: restarted, daemon_reload: true }
- name: перечитать scrape
  ansible.builtin.uri: { url: 'http://127.0.0.1:8428/-/reload', method: POST, status_code: [200, 204] }
  failed_when: false
- name: перезапустить grafana
  ansible.builtin.systemd_service: { name: grafana, state: restarted, daemon_reload: true }
- name: перезапустить таймеры копий
  ansible.builtin.systemd_service: { name: "{{ item }}", state: restarted, daemon_reload: true }
  loop: [massovka-msk-backup.timer, massovka-backup-check.timer]
