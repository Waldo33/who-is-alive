# Настройка машин «Массовки» из кода. Сейчас — системный слой (то, что раньше делало начало
# infra/game/setup.sh): пользователи и папки, подкачка, сеть, SSH, файрвол, журнал, ffmpeg, Postgres, туннели.
# Туннели SSH — роль tunnels. Приложение (Node, Caddy, службы игры, синий/зелёный) по-прежнему ставит setup.sh из game-deploy;
# переносится по ролям, каждая — сначала сухим прогоном (--check --diff) против живых серверов (docs/ansible.md).
- name: Системный слой
  hosts: all
  become: false
  roles:
    - base
    - postgres
    - tunnels

- name: Игровой сервер
  hosts: game
  roles:
    - ffmpeg
