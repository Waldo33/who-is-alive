# Европа: туннель пересылки в Москву (пока Москва жива) — как RELAY_TO в game-deploy
tunnels_all:
  - name: massovka-relay
    to: "tunnel@{{ moscow_ip | default('') }}"
    desc: "в Москву (Москва пересылает игру сюда, в Европу)"
    args: "-R 127.0.0.1:18090:127.0.0.1:8090 -R 127.0.0.1:18091:127.0.0.1:8080"
    when: "{{ moscow_ip | default('') != '' }}"
tunnels: "{{ tunnels_all | selectattr('when') | list }}"
# ключ туннеля сервера бота (Нидерланды): открыть у себя 9090 (бот) и 9428 (логи), пройти к базе, метрикам игры и машины
# (сам ключ роль читает с сервера в Нидерландах — /etc/massovka/tunnel_ed25519.pub)
tunnel_keys: "{{ [infra_tunnel_prefix ~ ' ' ~ infra_tunnel_pub] if infra_tunnel_pub | default('') != '' else [] }}"
infra_tunnel_prefix: 'restrict,port-forwarding,permitlisten="127.0.0.1:9090",permitlisten="127.0.0.1:9428",permitopen="127.0.0.1:5432",permitopen="127.0.0.1:8080",permitopen="127.0.0.1:9100"'
